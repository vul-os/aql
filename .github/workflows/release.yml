name: Release

# On tag vX.Y.Z:
#   - gateway binaries: linux/amd64, linux/arm64 (Pi), darwin/amd64, darwin/arm64
#   - controller binaries: same matrix
#   - Tauri desktop app on macos-latest (.dmg + .app.zip) — UNSIGNED: no Apple
#     signing identity or notarization is configured; macOS Gatekeeper will
#     warn on first launch (right-click > Open).
#   - one GitHub Release with all artifacts + a SHA256SUMS manifest covering
#     every one of them, plus a sigstore build-provenance attestation
#
# The container image for the same tag is published by docker.yml. It is NOT
# covered by SHA256SUMS or by the attestation here — a registry artifact is
# addressed by its own digest.
#
# The manifest is named SHA256SUMS (it was SHA256SUMS.txt): that is the name
# scripts/verify.sh looks for, and this repo has published no release under the
# old name to stay compatible with.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version-guard:
    name: tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag == VERSION == package.json == tauri.conf.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"   # v0.1.0-rc1 validates against base 0.1.0
          ver="$(tr -d '[:space:]' < VERSION)"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          echo "tag=$tag base=$base VERSION=$ver package.json=$pkg tauri.conf.json=$conf"
          [ "$base" = "$ver" ] && [ "$base" = "$pkg" ] && [ "$base" = "$conf" ] || {
            echo "::error::Version mismatch — bump VERSION, package.json and src-tauri/tauri.conf.json to match the tag before pushing it"; exit 1; }

  hub:
    name: hub ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version-guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      # The console, embedded into every released binary.
      #
      # Without it `go build` compiles portal_default.go and the binary serves a
      # placeholder that says the portal "is not embedded in this build", with
      # 404 on every console route. That is what every release tarball contained,
      # while README told people to open localhost:8080 and called it the whole
      # product. The React bundle cannot come out of the Go toolchain, so the
      # release has to build it — the same thing hub/Makefile's `portal` target
      # and e2e-browser's global setup both do.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Build the console
        run: |
          npm ci
          npm run build
          rm -rf hub/internal/portal/dist
          cp -r dist hub/internal/portal/dist
      - name: Build
        working-directory: hub
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="aql-hub_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p dist
          go build -trimpath -tags portal \
            -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
            -o "dist/${name}/aql-hub" ./cmd/hub
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hub/dist/*.tar.gz
          if-no-files-found: error

  controller:
    name: controller ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: version-guard
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
      - name: Build
        working-directory: controller
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          name="aql-controller_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p "dist/${name}"
          if [ -d cmd ]; then
            for d in cmd/*/; do
              go build -trimpath \
                -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
                -o "dist/${name}/$(basename "$d")" "./$d"
            done
          else
            go build -trimpath \
              -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" \
              -o "dist/${name}/aql-controller" .
          fi
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: controller-${{ matrix.goos }}-${{ matrix.goarch }}
          path: controller/dist/*.tar.gz
          if-no-files-found: error

  desktop:
    name: desktop app (macOS, unsigned)
    needs: version-guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Unsigned build: no APPLE_SIGNING_IDENTITY / notarization secrets are
      # set, so Tauri produces an unsigned .app/.dmg.
      - name: Tauri build
        run: npm run app:build
      - name: Package bundles
        run: |
          mkdir -p dist-desktop
          found=0
          while IFS= read -r -d '' dmg; do
            cp "$dmg" "dist-desktop/aql_${GITHUB_REF_NAME}_macos_$(uname -m).dmg"
            found=1
          done < <(find src-tauri/target -type f -name '*.dmg' -path '*/bundle/*' -print0)
          while IFS= read -r -d '' app; do
            ditto -c -k --keepParent "$app" \
              "dist-desktop/aql_${GITHUB_REF_NAME}_macos_$(uname -m).app.zip"
            found=1
          done < <(find src-tauri/target -type d -name '*.app' -path '*/bundle/*' -print0)
          if [ "$found" -eq 0 ]; then
            echo "no Tauri bundles found under src-tauri/target" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos
          path: dist-desktop/*
          if-no-files-found: error

  # no-broker-dep:allow-file: the comment below credits vul-os/ephor's RELEASE-TEMPLATE.md as
  # the source of this checksum-contract pattern — an attribution, not a dependency; this
  # workflow fetches from and builds against nothing named ephor.
  #
  # ===========================================================================
  # RELEASE SIGNING — this job and scripts/verify.sh are a matched pair,
  # copied from vul-os/ephor's RELEASE-TEMPLATE.md. This job is the only thing
  # that writes SHA256SUMS, verify.sh is the only thing that reads it, and this
  # job runs verify.sh against its own output before publishing, so the
  # producer and the consumer cannot drift apart silently.
  #
  # `needs:` named a job called `gateway`. There is no such job — the binary
  # job is `hub` (renamed when aql-gateway became aql-hub). GitHub rejects a
  # workflow whose `needs` names an unknown job ("Job 'release' depends on
  # unknown job 'gateway'"), so NO job in this file could run, builds included.
  # This repo has cut no release tag, so that never surfaced.
  #
  # WHY ATTESTATION AND NOT A DETACHED GPG SIGNATURE
  # -----------------------------------------------
  # A detached signature needs a private key: somewhere to live, an owner, a
  # rotation story, and a published public half users must obtain over some
  # channel they already trust — and if that channel is this same repo, the
  # signature proves nothing the TLS fetch did not. An unrotated key nobody
  # owns is the normal end state.
  #
  # actions/attest-build-provenance signs with a short-lived sigstore
  # certificate minted from this job's OIDC token: no long-lived key, no new
  # secret, no new hosted service. It is deliberately NOT load-bearing —
  # verify.sh's digest path needs only curl and sha256sum, and --attest is
  # opt-in, so if the action breaks, SHA256SUMS still verifies and nobody's
  # verification silently becomes a no-op.
  #
  # NOTE ON SCOPE: this covers the files attached to the GitHub Release. The
  # container image published by docker.yml is a separate artifact on a
  # separate registry and is NOT covered by this manifest or this attestation.
  # ===========================================================================
  release:
    name: publish GitHub release (checksummed + attested)
    needs: [hub, controller, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the Release and upload assets
      id-token: write       # mint the OIDC token the attestation is signed with
      attestations: write   # record the attestation against this repo
    steps:
      # verify.sh checks this job's own output below, so the repo must be here.
      - uses: actions/checkout@v4

      # Everything published lands in release/ and nothing else does, so the
      # manifest covers exactly the published set by construction rather than
      # by two lists someone keeps in sync by hand.
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Emit SHA256SUMS
        run: |
          set -euo pipefail
          cd release

          mapfile -t ASSETS < <(find . -maxdepth 1 -type f ! -name SHA256SUMS -exec basename {} \; | LC_ALL=C sort)

          # FAIL CLOSED. A build that produced nothing must be a red release,
          # not a green one with an empty manifest — an empty SHA256SUMS
          # vouches for nothing while looking exactly like one that vouched for
          # everything.
          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::release/ contains no artifacts — refusing to publish a release whose manifest would vouch for nothing."
            exit 1
          fi

          : > SHA256SUMS
          for a in "${ASSETS[@]}"; do
            sha256sum "$a" >> SHA256SUMS
          done

          # COVERAGE ASSERTION. Without this the step is trivially satisfiable:
          # a one-line manifest "covers" a nine-asset release and every later
          # check still passes. Pin line count to asset count. This is the
          # guard that would have caught the desktop bundles silently vanishing
          # from the manifest while the release still looked complete.
          LINES="$(wc -l < SHA256SUMS | tr -d ' ')"
          if [ "$LINES" -ne "${#ASSETS[@]}" ]; then
            echo "::error::SHA256SUMS has ${LINES} line(s) for ${#ASSETS[@]} staged artifact(s) — the manifest does not cover the release."
            exit 1
          fi

          echo "SHA256SUMS covers ${#ASSETS[@]} artifact(s):"
          cat SHA256SUMS
          printf '%s\n' "${ASSETS[@]}" > /tmp/release-assets.txt

      # The producer checked by the consumer, before anything is published.
      - name: Verify SHA256SUMS with the same script users run
        run: |
          set -euo pipefail
          mapfile -t ASSETS < /tmp/release-assets.txt
          bash scripts/verify.sh --dir release "${ASSETS[@]}"

      # A verifier whose failure paths are never exercised is a verifier that
      # has probably stopped failing.
      - name: Prove the verifier still refuses broken releases
        run: bash scripts/verify.sh --selftest

      # Short-lived sigstore cert from this job's OIDC identity — no secret is
      # referenced and none needs to exist. Attests every file in release/,
      # SHA256SUMS included, so the attestation on the manifest transitively
      # covers every asset it names.
      - name: Attest build provenance (sigstore via OIDC — no long-lived key)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "release/*"

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Container image: `ghcr.io/${{ github.repository_owner }}/aql-hub:${{ github.ref_name }}` (linux/amd64 + linux/arm64, published by the Docker workflow). It is NOT covered by the `SHA256SUMS` below — pin it by digest if you need that.

            The macOS desktop app is **unsigned** (no Apple signing identity is configured): on first launch, right-click the app and choose Open. That is separate from, and not replaced by, the build provenance attestation below.

            ### Verify before you run this

            ```sh
            curl -fsSLO https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/scripts/verify.sh
            bash verify.sh --tag ${{ github.ref_name }} --attest aql-hub_${{ github.ref_name }}_linux_amd64.tar.gz
            ```

            `SHA256SUMS` covers every attached file. `verify.sh` fetches it,
            looks up the exact entry for the asset and compares digests; it
            exits non-zero, with a distinct diagnostic, on a missing or
            malformed manifest, a missing entry, a truncated download or a
            digest mismatch. There is no skip path. `--attest` additionally
            checks the sigstore build provenance (needs the `gh` CLI); without
            it, provenance is NOT checked and the script says so.
