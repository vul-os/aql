name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    name: frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The route-parity test (src/lib/__tests__/routeParity.test.ts) shells
      # out to `go run ./cmd/routegen` in hub/ to get the hub's real
      # registered routes — it's the mechanical safeguard against the console
      # drifting from the routes the gateway actually serves again.
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: npm ci
      - run: npm run typecheck     # tsc --noEmit
      - run: npm test              # vitest run
      - run: npm run build         # tsc -b && vite build

  rust:
    name: rust (fmt + clippy + check, Tauri shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 on Linux needs the WebKitGTK/GTK development headers before
      # the crates in src-tauri/ will even configure.
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri.conf.json points frontendDist at Vite's output, so the bundle has
      # to exist before cargo can configure the build.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  hub:
    name: hub (vet + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: go vet
        working-directory: hub
        run: go vet ./...
      - name: go build
        working-directory: hub
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go test
        working-directory: hub
        run: go test ./...

  controller:
    name: controller (vet + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
      - name: go vet
        working-directory: controller
        run: go vet ./...
      - name: go build
        working-directory: controller
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go test
        working-directory: controller
        run: go test ./...
      # The build tags are where this module's platform support actually lives,
      # and a tag mistake is silent: the code compiles, the feature is simply
      # absent. The BLE peripheral spent its life Linux-only because the file
      # was named start_ble_linux.go — Go's IMPLICIT filename constraint beats
      # the //go:build line, and nothing on a Linux runner could notice.
      #
      # Cross-compilation is cheap and catches exactly that.
      - name: cross-build the optional backends
        working-directory: controller
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          for goos in linux windows darwin; do
            GOOS=$goos GOARCH=amd64 go build ./...
            GOOS=$goos GOARCH=amd64 go build -tags ble ./...
          done
          # The GPIO relay is genuinely Linux-only (character-device ioctls);
          # it must still COMPILE with the tag set on other platforms, because
          # the config parsing and state machine are portable and only Open
          # returns ErrUnsupported.
          for goos in linux windows darwin; do
            GOOS=$goos GOARCH=amd64 go build -tags gpio ./...
          done

  e2e-browser:
    name: e2e-browser (real Chromium against a real hub binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # e2e-browser/global-setup.ts builds the real gateway binary with
      # `-tags portal` (the embedded React console) before any test runs — see
      # e2e-browser/README.md for why that's the only faithful way to test what
      # actually ships (vs. a mocked backend or a separately-run dev server
      # that doesn't reproduce the embedded-console SPA fallback).
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: npm ci
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e:
    name: e2e (cross-module, real binaries over the wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # e2e/go.mod pins the newest Go (matches the gateway); the same
          # toolchain builds the controller module fine too.
          go-version-file: e2e/go.mod
      - name: go vet
        working-directory: e2e
        run: go vet ./...
      - name: go test
        working-directory: e2e
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -timeout 900s ./...
