name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  frontend:
    name: frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The route-parity test (src/lib/__tests__/routeParity.test.ts) shells
      # out to `go run ./cmd/routegen` in hub/ to get the hub's real
      # registered routes — it's the mechanical safeguard against the console
      # drifting from the routes the gateway actually serves again.
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: npm ci
      # tsc -b --noEmit. The -b matters: this repo's root tsconfig has
      # "files": [], so a plain `tsc --noEmit` type-checks NOTHING and passes
      # on a deliberately broken file. It did exactly that until it was caught.
      - run: npm run typecheck
      - run: npm test              # vitest run
      - run: npm run build         # tsc -b && vite build
      # The doc-accuracy gate. It has existed for a long time and CI never ran
      # it — every "claims green" in this repo's history was somebody running it
      # by hand, which is not a gate, it is a habit.
      #
      # What it checks, precisely, so nobody trusts it further than it goes: each
      # entry in scripts/feature-claims.manifest.mjs declares a docStatus, and
      # this fails when that disagrees with evidence found in the code. It does
      # NOT read README prose — adding a false sentence about an unbuilt driver
      # passes, because no manifest entry covers it. Doc drift outside the
      # manifest is caught by review, or not at all.
      - run: npm run check:claims
      # The protocol vectors. These pin the signed wire format a deployed
      # controller implements; a change that breaks them must not reach main on
      # the strength of nobody having checked locally.
      - run: node proto/vectors/verify.mjs
      # Byte-reproducibility of the generator, which is the property that lets a
      # reviewer trust a large generated-JSON diff at all: if regenerating
      # changes nothing, the committed corpus IS what generate.mjs produces, so
      # a diff in these files is a deliberate contract change rather than
      # incidental churn. proto/vectors/HARNESS-PATTERN.md tells other repos to
      # run exactly this; it should not be advice this repo only gives.
      - name: vectors are byte-reproducible
        run: |
          set -eu
          node proto/vectors/generate.mjs
          # `git status`, not `git diff`: diff cannot see a file the generator
          # created that was never committed, and a vector file nobody
          # committed is a vector file nothing checks. Scoped to the generated
          # JSON because the .md and .mjs here are hand-written.
          changed="$(git status --porcelain -- 'proto/vectors/*.json')"
          [ -z "$changed" ] || {
            echo "::error::regenerating proto/vectors/ changed or added files:"
            echo "$changed"
            exit 1
          }

  rust:
    name: rust (fmt + clippy + check, Tauri shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Tauri v2 on Linux needs the WebKitGTK/GTK development headers before
      # the crates in src-tauri/ will even configure.
      - name: Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri.conf.json points frontendDist at Vite's output, so the bundle has
      # to exist before cargo can configure the build.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  hub:
    name: hub (vet + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      # gofmt, which `go vet` does not cover. Formatting drift is trivial on its
      # own and it makes every subsequent diff noisier, which is how a real
      # change gets lost in a reformat.
      - name: gofmt
        working-directory: hub
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: hub
        run: go vet ./...
      - name: go build
        working-directory: hub
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      # -count=1 on every go test in this file, and it is load-bearing.
      #
      # actions/setup-go caches the Go BUILD cache, which includes the test
      # cache, so results carry across runs. These modules read the shared
      # conformance corpus in proto/vectors/ from OUTSIDE their own module
      # tree, and Go does not invalidate a cached result when that changes.
      #
      # Verified locally rather than assumed: editing grants.json so a test
      # MUST fail leaves `go test ./internal/keys/` reporting `ok (cached)`,
      # while -count=1 on the same tree reports FAIL. That is how the hub's
      # independent grant verifier sat accepting a revoked grant for two
      # commits with every gate green.
      - name: go test
        working-directory: hub
        run: go test -count=1 ./...
      # The hub ships four binaries and CI only ever built one of them.
      #
      # release.yml produces linux/amd64, linux/arm64, darwin/amd64 and
      # darwin/arm64, and it runs on tag push only — so a change that broke any
      # platform but the runner's stayed green until somebody cut a release. The
      # controller job has cross-builds for exactly this reason and says why; the
      # hub had the same exposure and no equivalent step.
      #
      # Compile only. The tests run on the runner's platform above; this is here
      # to catch a build that cannot happen at all, which needs no execution.
      - name: cross-build every released platform
        working-directory: hub
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS="${pair%%/*}" GOARCH="${pair##*/}" go build ./...
          done
      # A short fuzz run on the parsers that read UNAUTHENTICATED bytes.
      #
      # Seed inputs already run for free in `go test ./...` above — a Fuzz
      # target executes its corpus as an ordinary test — so this step is for
      # finding inputs nobody has thought of yet. Thirty seconds each is not a
      # thorough campaign; it is a tripwire that costs a minute and has years of
      # pushes to get lucky in.
      #
      # Run by hand at length first. The five original targets: ~5 million
      # executions, nothing found, which is why they are worth KEEPING green
      # rather than a reason to skip them. The four camera targets added later
      # were not so quiet — see FuzzParseSDP's note below.
      - name: fuzz (short)
        working-directory: hub
        run: |
          set -eu
          # Fuzz a named target, failing if it does not exist.
          #
          # `go test -fuzz X` exits 0 when X matches NOTHING — it silently runs
          # no fuzzing at all. Both JCS entries here became no-ops the moment
          # the canonicalizer moved to its own module, and CI stayed green
          # while fuzzing nothing. -list is what tells the difference.
          fuzz() {
            go test "$1" -list='Fuzz.*' | grep -qx "$2" \
              || { echo "::error::no fuzz target $2 in $1 — did it move?"; exit 1; }
            go test "$1" -run xxx -fuzz "$2" -fuzztime 30s
          }
          fuzz ./internal/discovery/ FuzzParseResponse
          fuzz ./internal/discovery/ FuzzDecodeName
          fuzz ./internal/devices/modbus/ FuzzReadADU
          fuzz ./internal/devices/modbus/ FuzzDecodeReadResponse
          fuzz ./internal/devices/modbus/ FuzzMetricDecode
          # The camera pipeline, which reads bytes from a device on the LAN that
          # the hub dialled. These four were absent from this list — the H.264
          # pair since it was written, and the RTSP pair from the day they were
          # added — so their seed corpora ran during `go test` and no fuzzing
          # ever happened here. FuzzParseSDP found a request injection within
          # seconds the first time it was run properly, which is the argument
          # for the two minutes this adds.
          fuzz ./internal/devices/camera/ FuzzDepacketizerPush
          fuzz ./internal/devices/camera/ FuzzDepacketizerSequence
          fuzz ./internal/devices/camera/ FuzzReadRTSPResponse
          fuzz ./internal/devices/camera/ FuzzParseSDP

  race:
    # The race detector, which had never been run on this repository until it
    # was tried by hand and came back clean across all three modules and both
    # tagged backends. Clean is the point: it is worth KEEPING clean, and a
    # detector nobody runs proves nothing about the concurrent code it would
    # have covered — the relay's timers and goroutines, the hub's handlers, the
    # controller's transport.
    #
    # Its own job, so it runs beside the ordinary suites instead of delaying
    # them. It is genuinely slow: hub/internal/httpapi took ~18 minutes locally,
    # because every register and login derives an argon2id hash at 64 MiB and
    # the detector multiplies that. The default `go test` timeout is 600s, and
    # exceeding it reports a FAILURE that reads exactly like a race — which is
    # what happened on the first run here — so the timeout is set explicitly and
    # generously rather than left to be rediscovered.
    #
    # The hashing parameters are deliberately NOT lowered for tests. A mutable
    # global controlling password-hash strength is the kind of thing that gets
    # turned down by accident and never turned back up; a slow CI job is the
    # cheaper problem.
    name: race detector (all modules)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - name: controller
        working-directory: controller
        run: |
          set -eux
          go test -race -count=1 -timeout 20m ./...
          # The optional backends carry the concurrent code that matters most
          # here: the relay's watchdog timers and the BLE session.
          go test -race -count=1 -timeout 20m -tags gpio ./...
          go test -race -count=1 -timeout 20m -tags ble ./...
      - name: hub
        working-directory: hub
        run: go test -race -count=1 -timeout 45m ./...
      - name: e2e
        working-directory: e2e
        run: go test -race -count=1 -timeout 20m ./...

  jcs:
    name: jcs (the shared canonicalizer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: jcs/go.mod
      # Its own job because it is its own module, and because of what it is:
      # every signed document in this product is signed and verified over bytes
      # this package produces. It used to be three hand-copied implementations,
      # one of which silently rounded 2^53+1 for as long as it existed. There is
      # one now, so it carries the whole weight and nothing else cross-checks it.
      - name: gofmt
        working-directory: jcs
        run: |
          set -eu
          out="$(gofmt -l .)"
          [ -z "$out" ] || { echo "::error::gofmt: $out"; exit 1; }
      - name: go vet
        working-directory: jcs
        run: go vet ./...
      - name: go test
        working-directory: jcs
        run: go test -race -count=1 ./...
      - name: fuzz (short)
        working-directory: jcs
        run: |
          set -eu
          # Same guard as the other fuzz steps: -fuzz exits 0 on a target that
          # does not exist, and these two targets have already moved once.
          fuzz() {
            go test "$1" -list='Fuzz.*' | grep -qx "$2" \
              || { echo "::error::no fuzz target $2 in $1 — did it move?"; exit 1; }
            go test "$1" -run xxx -fuzz "$2" -fuzztime 30s
          }
          fuzz . FuzzCanonicalizeJSONProperties
          fuzz . FuzzCanonicalizeValue

  controller:
    name: controller (vet + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
      # gofmt, which `go vet` does not cover. Formatting drift is trivial on its
      # own and it makes every subsequent diff noisier, which is how a real
      # change gets lost in a reformat.
      - name: gofmt
        working-directory: controller
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        working-directory: controller
        run: go vet ./...
      - name: go build
        working-directory: controller
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      - name: go test
        working-directory: controller
        run: go test -count=1 ./...
      # The build tags are where this module's platform support actually lives,
      # and a tag mistake is silent: the code compiles, the feature is simply
      # absent. The BLE peripheral spent its life Linux-only because the file
      # was named start_ble_linux.go — Go's IMPLICIT filename constraint beats
      # the //go:build line, and nothing on a Linux runner could notice.
      #
      # Cross-compilation is cheap and catches exactly that.
      - name: cross-build the optional backends
        working-directory: controller
        env:
          CGO_ENABLED: "0"
        run: |
          set -eux
          for goos in linux windows darwin; do
            GOOS=$goos GOARCH=amd64 go build ./...
            GOOS=$goos GOARCH=amd64 go build -tags ble ./...
          done
          # The GPIO relay is genuinely Linux-only (character-device ioctls);
          # it must still COMPILE with the tag set on other platforms, because
          # the config parsing and state machine are portable and only Open
          # returns ErrUnsupported.
          for goos in linux windows darwin; do
            GOOS=$goos GOARCH=amd64 go build -tags gpio ./...
          done
          # ARM is where a controller actually runs, and 32-bit ARM is where
          # the GPIO uAPI layout could plausibly differ: Go aligns uint64 to 4
          # bytes on arm and 386, not 8. gpio_abi_static.go asserts every
          # kernel struct size and field offset as a CONSTANT expression, so
          # these builds are what verify the layout on the architectures the
          # product ships to — the runtime tests only ever see the runner's
          # amd64.
          for goarch in arm64 arm 386; do
            GOOS=linux GOARCH=$goarch go build -tags gpio ./...
          done
      # Building a tagged backend proves it compiles. It does NOT run the tests
      # written for it, and `go test ./...` above cannot: a file behind
      # //go:build gpio is invisible without the tag. Three test files —
      # gpio_test.go, gpio_abi_test.go, gpio_linux_test.go — had therefore never
      # executed in CI at all, including the ones pinning the kernel ABI struct
      # sizes and ioctl request numbers that the driver's correctness rests on.
      #
      # They run on the Linux runner, which is also the only place
      # gpio_linux_test.go compiles.
      - name: go test (optional backends)
        working-directory: controller
        run: |
          set -eux
          go test -count=1 -tags gpio ./...
          go test -count=1 -tags ble ./...
      # A short fuzz run on the parsers that read UNAUTHENTICATED bytes.
      #
      # Seed inputs already run for free in `go test ./...` above — a Fuzz
      # target executes its corpus as an ordinary test — so this step is for
      # finding inputs nobody has thought of yet. Thirty seconds each is not a
      # thorough campaign; it is a tripwire that costs a minute and has years of
      # pushes to get lucky in.
      #
      # Run by hand at length first: ~5 million executions across the four
      # targets found nothing, which is why they are worth keeping green rather
      # than a reason to skip them.
      - name: fuzz (short)
        working-directory: controller
        run: |
          set -eu
          # Fuzz a named target, failing if it does not exist.
          #
          # `go test -fuzz X` exits 0 when X matches NOTHING — it silently runs
          # no fuzzing at all. Both JCS entries here became no-ops the moment
          # the canonicalizer moved to its own module, and CI stayed green
          # while fuzzing nothing. -list is what tells the difference.
          fuzz() {
            go test "$1" -list='Fuzz.*' | grep -qx "$2" \
              || { echo "::error::no fuzz target $2 in $1 — did it move?"; exit 1; }
            go test "$1" -run xxx -fuzz "$2" -fuzztime 30s
          }
          fuzz ./internal/grants/ FuzzHandleOpen
          fuzz ./internal/grants/ FuzzHandleProof
          fuzz ./internal/framing/ FuzzReassemblerPush
          fuzz ./internal/framing/ FuzzChunkRoundTrip
          # mDNS parses datagrams anyone on the LAN can send to a device that
          # opens gates, and it is hand-rolled DNS wire format.
          fuzz ./internal/mdns/ FuzzDecodeName
          fuzz ./internal/mdns/ FuzzIsQueryFor

  e2e-browser:
    name: e2e-browser (real Chromium against a real hub binary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # e2e-browser/global-setup.ts builds the real gateway binary with
      # `-tags portal` (the embedded React console) before any test runs — see
      # e2e-browser/README.md for why that's the only faithful way to test what
      # actually ships (vs. a mocked backend or a separately-run dev server
      # that doesn't reproduce the embedded-console SPA fallback).
      - uses: actions/setup-go@v5
        with:
          go-version-file: hub/go.mod
          cache-dependency-path: hub/go.sum
      - run: npm ci
      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  e2e:
    name: e2e (cross-module, real binaries over the wire)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # e2e/go.mod pins the newest Go (matches the gateway); the same
          # toolchain builds the controller module fine too.
          go-version-file: e2e/go.mod
      - name: go vet
        working-directory: e2e
        run: go vet ./...
      - name: go test
        working-directory: e2e
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -timeout 900s ./...

  # The release verifier is only worth having if its REFUSALS are exercised.
  # scripts/verify.sh is what a user runs before executing a downloaded hub,
  # controller or desktop bundle; a checksum guard that has quietly stopped
  # failing looks identical, from a green CI run, to one that works. Run the
  # full synthetic-origin failure matrix on every push, not only at release
  # time — release.yml is tag-triggered and, until this pass, could not even
  # start (its `needs:` named a job that does not exist).
  image:
    # Build the container image on every run. It is not pushed here — docker.yml
    # does that, on manual dispatch only, which is exactly why this is needed:
    # nothing built the image automatically, so it broke and stayed broken.
    #
    # It broke the day `replace github.com/vul-os/aql/jcs => ../jcs` was added to
    # hub/go.mod. The workflow built with `context: hub`, so the sibling module
    # was outside the build context and `go mod download` failed with
    # "reading /jcs/go.mod: no such file or directory". The image is what the
    # release notes tell people to pull, so it was advertised and unbuildable for
    # three days with nothing to say so.
    #
    # One platform. The cross-platform build lives in docker.yml and needs QEMU;
    # this is here to catch a build that cannot work at all, which is
    # architecture-independent.
    name: container image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Context is the repository root, matching docker.yml, because the
      # Dockerfile needs both modules.
      - name: docker build
        run: docker build -f hub/Dockerfile -t aql-hub:ci .
      # Building proves it compiles. Running proves the image is usable — a
      # distroless image with a missing entrypoint or an unwritable /data builds
      # perfectly and fails on first start.
      - name: the image starts and serves
        run: |
          set -eux
          docker run -d --name aqlci -p 18080:8080 aql-hub:ci
          for i in $(seq 1 30); do
            docker logs aqlci 2>&1 | grep -q "aql hub" && break
            sleep 1
          done
          docker logs aqlci
          curl -fsS -o /dev/null http://127.0.0.1:18080/
          docker exec aqlci /healthprobe
          docker rm -f aqlci
      # The image must be able to mint the key it consumes.
      #
      # gen-data-key exists because hub/README tells an operator to set
      # AQL_DATA_KEY and, until this week, nothing in the product could produce
      # one — sealed.NewKey had no caller at all. Most operators will run it FROM
      # this image, and that path is covered by no Go test: a subcommand that
      # works under `go run` and not in the artifact is a feature nobody
      # deploying it can use.
      #
      # The ROUND TRIP is the assertion — the key this image mints is the key
      # this image boots with. Checking that the output looks like base64 would
      # accept a key of the wrong decoded length, which is exactly what an
      # operator improvising with `openssl rand` produces.
      #
      # The bogus key is the control. Without it, a boot succeeding for any other
      # reason — the key being ignored, most obviously — reads as a pass.
      - name: the image can mint the key it consumes
        run: |
          set -eux
          KEY="$(docker run --rm --entrypoint /aql-hub aql-hub:ci gen-data-key)"
          docker run -d --name aqlkey -e AQL_DATA_KEY="$KEY" aql-hub:ci
          for _ in $(seq 1 30); do
            docker logs aqlkey 2>&1 | grep -q "aql hub" && break
            sleep 1
          done
          docker logs aqlkey 2>&1 | grep -q "aql hub"
          docker rm -f aqlkey
          docker run --rm -e AQL_DATA_KEY=not-a-key aql-hub:ci 2>&1 \
            | grep -q "data key is not valid base64"
          # The other subcommand added alongside it, reaching its own code rather
          # than falling through to booting a hub against /data.
          docker run --rm --entrypoint /aql-hub aql-hub:ci mqtt-scan 2>&1 \
            | grep -q "device-config is required"

      # The image must resolve IANA timezones.
      #
      # Schedules and energy rollups are anchored to a named zone, and getting
      # that wrong is silent: rollup buckets split at the wrong hour and the
      # numbers still look plausible. schedule.go embeds time/tzdata so this does
      # not depend on the base image, but the base image is the thing that
      # changes without anyone thinking about timezones — so it is checked on the
      # artifact, not on the assumption.
      #
      # `energy rebucket` loads the zone before it touches the database, so a
      # valid zone reaching the "no hub database" refusal proves LoadLocation
      # worked. The bogus zone is the control: without it, a command that failed
      # for any reason would read as a pass.
      - name: the image resolves timezones
        run: |
          set -eux
          docker run --rm --entrypoint /aql-hub aql-hub:ci \
            energy rebucket -account probe -tz America/New_York -data /data 2>&1 \
            | grep -q "no hub database"
          docker run --rm --entrypoint /aql-hub aql-hub:ci \
            energy rebucket -account probe -tz Not/AZone -data /data 2>&1 \
            | grep -q "is not a timezone this system knows"

  verify-script:
    name: release verifier (lint + failure matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax check
        run: bash -n scripts/verify.sh

      - name: ShellCheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck scripts/verify.sh

      # Each case is a synthetic origin broken in exactly one way; the matrix
      # asserts the exit code AND that a diagnostic was printed, because
      # "aborted with no message" was the real-world bug being guarded against.
      - name: Failure matrix (synthetic origin)
        run: bash scripts/verify.sh --selftest
