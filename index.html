<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta name="format-detection" content="telephone=no" />

        <title>Aql — one hub owns everything</title>
        <meta
            name="description"
            content="Aql is an open-source command centre for the physical world: cameras, lights, mowers, sensors, meters and bots under one hub you run yourself. No cloud broker, no account, no telemetry."
        />
        <meta
            name="keywords"
            content="home automation, self-hosted, device hub, access control, IoT, robotics, energy monitoring, local-first, open source"
        />
        <meta name="author" content="Aql" />
        <meta name="application-name" content="Aql" />
        <link rel="canonical" href="https://vulos.org/projects/aql/" />

        <meta
            name="theme-color"
            content="#FAFAF8"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#0F0E0C"
            media="(prefers-color-scheme: dark)"
        />
        <meta name="color-scheme" content="light dark" />

        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon-16x16.png"
        />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />
        <meta name="apple-mobile-web-app-title" content="Aql" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Aql" />
        <meta property="og:url" content="https://vulos.org/projects/aql/" />
        <meta property="og:title" content="Aql — one hub owns everything" />
        <meta
            property="og:description"
            content="An open-source command centre for the physical world. One hub, on a box you own — no cloud broker, no account, no telemetry."
        />
        <meta property="og:image" content="https://vulos.org/projects/aql/assets/og-card.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="The Aql arch mark on a warm near-black field — a command centre for the physical world."
        />
        <meta property="og:locale" content="en_US" />

        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Aql — one hub owns everything" />
        <meta
            name="twitter:description"
            content="An open-source command centre for the physical world. One hub, on a box you own — no cloud broker, no account, no telemetry."
        />
        <meta name="twitter:image" content="https://vulos.org/projects/aql/assets/og-card.png" />

        <meta name="robots" content="index,follow,max-image-preview:large" />

        <!-- Fonts are self-hosted (see /fonts + @font-face in src/styles/main.css)
             so the app makes no request to Google. -->
        <link
            rel="preload"
            href="/fonts/fraunces-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link
            rel="preload"
            href="/fonts/inter-var.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
