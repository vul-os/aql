<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="t d">
  <title id="t">Aql — a command centre for the physical world</title>
  <desc id="d">The Aql arch mark on a warm near-black field, ringed by the devices a hub owns, with the wordmark and tagline.</desc>

  <!-- Colours are the warm palette (docs/DESIGN-SYSTEM.md §1): the field is
       aside-surface #141210 blended with its dark-theme tuning #1A1714, ink is
       #F5EFE6, accent is dark-theme terracotta #E0896A.
       Type is a system serif on purpose: OG cards are rasterised by whoever
       renders them, so they cannot rely on the vendored Fraunces files. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1714"/>
      <stop offset="1" stop-color="#141210"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- horizon -->
  <line x1="0" y1="500" x2="1200" y2="500" stroke="#F5EFE6" stroke-opacity="0.08" stroke-width="1"/>

  <!-- eyebrow -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#F5EFE6" fill-opacity="0.5" font-size="20" letter-spacing="6">
    <text x="100" y="100">AQL · ONE HUB OWNS EVERYTHING</text>
  </g>

  <!-- the hub: the arch mark, ringed by a whisper of the things around it -->
  <g transform="translate(796, 139)">
    <circle cx="176" cy="176" r="168" fill="none" stroke="#F5EFE6" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="2 12"/>
    <g fill="#F5EFE6" fill-opacity="0.3">
      <circle cx="176" cy="8" r="4.5"/>
      <circle cx="335.8" cy="124.1" r="4.5"/>
      <circle cx="274.7" cy="311.9" r="4.5"/>
      <circle cx="77.3" cy="311.9" r="4.5"/>
      <circle cx="16.2" cy="124.1" r="4.5"/>
    </g>
    <g transform="translate(16, 16) scale(5)">
      <path d="M14 50 V32 a18 18 0 0 1 36 0 V50 H40 V32 a8 8 0 0 0 -16 0 V50 Z"
            fill="none" stroke="#F5EFE6" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="42" r="3" fill="#E0896A"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="100" y="335" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" font-size="148" fill="#F5EFE6">Aql</text>

  <text x="100" y="410" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#F5EFE6" fill-opacity="0.78">A command centre for the physical world.</text>

  <!-- accent rule -->
  <line x1="100" y1="455" x2="200" y2="455" stroke="#E0896A" stroke-width="3" stroke-linecap="round"/>

  <!-- footer -->
  <g font-family="Helvetica, Arial, sans-serif" fill="#F5EFE6" fill-opacity="0.5" font-size="22">
    <text x="100" y="555">github.com/vul-os/aql</text>
    <text x="1100" y="555" text-anchor="end">Self-hosted · Signed · No cloud broker</text>
  </g>
</svg>
